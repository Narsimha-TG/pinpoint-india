name: Refresh India postal directory

on:
  schedule:
    - cron: '17 5 5 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and validate monthly postal directory
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: node scripts/refresh-postal-data.mjs

      - name: Commit refreshed directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/postal-locations.json
          if git diff --cached --quiet; then
            echo 'Postal directory is unchanged.'
            exit 0
          fi
          git commit -m "Refresh official India postal directory"
          git push
